<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="易码 Yimark">
  <!--
    印章字标「Y」（Yimark 首字母）：实心陶土橙底 + 白字。
    笔画刻意加粗、两臂与竖笔之间拉开距离 —— 16px 下细笔画和小留白最容易糊成一团。
    字形走路径而非 <text>，避免不同系统字体不一致甚至不渲染。
  -->
  <rect width="32" height="32" rx="7.5" fill="#d97757"/>
  <g fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 两臂：在中心汇成圆角交点 -->
    <path d="M9.4 8.2 16 16.6 22.6 8.2"/>
    <!-- 竖笔：自交点向下 -->
    <path d="M16 16.6V23.8"/>
  </g>
</svg>
