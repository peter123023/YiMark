# 文章分享 API 反代（部署时并入 /etc/nginx/snippets/yimark-wechat-proxy.conf，
# 或同目录新建 snippet；精确/正则 location 优先级高于前缀 location /yimark/）
#
# 服务本体：server/yimark_share.py，127.0.0.1:8790，systemd 托管

# 创建分享（POST，带图片上限 6MB）
location = /yimark/api/share {
    client_max_body_size 6m;
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}

# 读取分享（GET /yimark/api/read/<id>，10 位 base62）
# 注意：正则含 {} 必须整体加引号，否则 nginx 把 { 当块分隔符
location ~ "^/yimark/api/read/[A-Za-z0-9]{10}$" {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}
